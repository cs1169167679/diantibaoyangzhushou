<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<title>电梯保养管理</title>
<style>
:root{--green:#2e9e5b;--orange:#f39c12;--red:#e53935;--dark:#b71c1c;--line:#e6eaef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f2f4f7;color:#1c2430;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1565c0,#1e88e5);color:#fff;padding:14px 16px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(21,101,192,.25)}
.hd-title{font-size:18px;font-weight:700;letter-spacing:.5px}
.hd-sub{font-size:12px;opacity:.85;margin-top:3px}
.add-btn{border:0;background:rgba(255,255,255,.22);color:#fff;padding:9px 15px;border-radius:20px;font-size:14px;font-weight:600;font-family:inherit}
.add-btn:active{background:rgba(255,255,255,.38)}
.summary{display:flex;gap:8px;padding:12px 16px 2px;overflow-x:auto}
.chip{flex:0 0 auto;background:#fff;border-radius:12px;padding:8px 13px;font-size:12.5px;color:#5a6672;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:6px}
.chip b{font-size:15px;color:#1c2430}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.g{background:var(--green)}.dot.o{background:var(--orange)}.dot.r{background:var(--red)}
/* 搜索框 */
.search-bar{padding:0 16px 4px}
.search-bar input{width:100%;padding:10px 14px;border:1px solid #e2e8ef;border-radius:12px;font-size:14px;background:#fff;color:#1c2430;-webkit-appearance:none;box-sizing:border-box}
.search-bar input:focus{outline:none;border-color:#1565c0}
main{padding:10px 16px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(16,42,67,.07);border-left:5px solid #ccc}
.card.lv-green{border-left-color:var(--green)}
.card.lv-orange{border-left-color:var(--orange)}
.card.lv-red{border-left-color:var(--red)}
.card.lv-overdue{border-left-color:var(--dark);background:#fff8f8}
.card.lv-done{border-left-color:#b0bcc7;background:#fbfcfd}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.title{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700;line-height:1.3}
.name{word-break:break-all}
.head-right{display:flex;gap:2px;flex:0 0 auto}
.icon-btn{border:0;background:none;font-size:15px;padding:4px 6px;border-radius:8px;color:#9aa5b1;font-family:inherit}
.icon-btn:active{background:#f0f3f7}
.card.lv-overdue .icon-btn{color:#e53935}
.warn{color:var(--red);font-size:18px;line-height:1;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.6}}
.check{color:var(--green);font-size:18px;font-weight:900}
.date-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:#7b8794;margin:9px 0 10px}
.date-line b{color:#1c2430;font-weight:600;font-variant-numeric:tabular-nums}
.arrow{color:#c3ccd6}
.track{height:10px;border-radius:6px;overflow:hidden;background:linear-gradient(90deg,#e3f3e8 0 33.33%,#fdf0dd 33.33% 66.66%,#fde3e3 66.66% 100%)}
.fill{height:100%;border-radius:6px;transition:width .45s ease}
.lv-overdue .fill{animation:blink 1s ease-in-out infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.45}}
.scale{display:flex;justify-content:space-between;font-size:10px;color:#a8b3be;margin-top:3px}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.days{font-size:14px;font-weight:700}
.muted{color:#8b96a1;font-size:12px}
.btn-done{border:0;background:#1565c0;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;font-family:inherit;white-space:nowrap}
.btn-done:active{transform:scale(.97);background:#0d47a1}
.tip{margin-top:10px;font-size:12.5px;font-weight:600;background:#fff2f2;border-radius:9px;padding:8px 10px}
.empty{padding:70px 20px;text-align:center;color:#9aa5b1}
.empty-ico{font-size:46px;margin-bottom:14px}
.empty-t{font-size:16px;font-weight:600;color:#5a6672;margin-bottom:8px}
.empty-s{font-size:13px;line-height:1.7}
/* 月份分组样式 */
.month-group{margin-bottom:6px}
.month-header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 8px;font-size:14px;font-weight:700;color:#1565c0}
.month-title{position:relative;padding-left:12px}
.month-title::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:14px;border-radius:2px;background:#1565c0}
.month-count{font-size:12px;font-weight:500;color:#8b96a1;background:#eef3f9;border-radius:10px;padding:2px 9px}
.month-body{display:flex;flex-direction:column;gap:12px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
.tabbar button{flex:1;border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:#8b96a1;font-family:inherit;position:relative}
.tabbar button.active{color:#1565c0;font-weight:700}
.tabbar .ico{font-size:19px;line-height:1.1}
.badge{position:absolute;top:4px;left:50%;margin-left:6px;min-width:16px;height:16px;line-height:16px;padding:0 4px;background:#1565c0;color:#fff;border-radius:8px;font-size:10px;font-style:normal;font-weight:700;text-align:center}
.badge.red{background:var(--red)}
.badge.gray{background:#9aa5b1}
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.show{display:block}
.modal .mask{position:absolute;inset:0;background:rgba(12,25,40,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-title{font-size:17px;font-weight:700;text-align:center;margin-bottom:6px}
.sheet label{display:block;font-size:13px;color:#7b8794;margin:14px 0 6px}
.sheet input{width:100%;padding:12px 14px;border:1.5px solid #e2e8ef;border-radius:12px;font-size:16px;font-family:inherit;background:#f8fafc;color:#1c2430;-webkit-appearance:none}
.sheet input:focus{outline:none;border-color:#1565c0;background:#fff}
.sheet-actions{display:flex;gap:12px;margin-top:24px}
.sheet-actions button{flex:1;padding:13px;border-radius:12px;border:0;font-size:15.5px;font-weight:600;font-family:inherit}
.btn-ghost{background:#eef2f6;color:#5a6672}
.btn-primary{background:#1565c0;color:#fff}
.btn-primary:active{background:#0d47a1}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:rgba(28,36,48,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div>
    <div class="hd-title">电梯保养管理</div>
    <div class="hd-sub" id="todayLabel"></div>
  </div>
  <button class="add-btn" id="addBtn">＋ 添加</button>
</header>

<div class="summary" id="summary"></div>

<!-- 搜索框 -->
<div class="search-bar">
  <input id="searchInput" type="search" placeholder="🔍 搜索电梯名称..." autocomplete="off">
</div>

<main id="list"></main>

<nav class="tabbar">
  <button data-tab="normal" class="active">
    <span class="ico">🛠️</span><span>日常保养</span><i class="badge" id="b-normal"></i>
  </button>
  <button data-tab="overdue">
    <span class="ico">⚠️</span><span>超期保养</span><i class="badge red" id="b-overdue"></i>
  </button>
  <button data-tab="done">
    <span class="ico">✅</span><span>保养完成</span><i class="badge gray" id="b-done"></i>
  </button>
</nav>

<div class="modal" id="modal">
  <div class="mask" data-close></div>
  <div class="sheet">
    <div class="sheet-title" id="modalTitle">添加电梯</div>
    <label>电梯名称 / 编号</label>
    <input id="inName" type="text" placeholder="例如：1号楼1号梯" maxlength="30">
    <label>本次保养日期</label>
    <input id="inDate" type="date">
    <label>保养周期（天）</label>
    <input id="inCycle" type="number" min="1" max="365" value="15">
    <div class="sheet-actions">
      <button class="btn-ghost" data-close>取消</button>
      <button class="btn-primary" id="okBtn">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const fmtD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmtD(new Date());
const parseD = s => { const [a,b,c] = String(s).split('-').map(Number); return new Date(a, b-1, c); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return fmtD(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WEEK = ['日','一','二','三','四','五','六'];
const COLOR = { green:'#2e9e5b', orange:'#f39c12', red:'#e53935', overdue:'#b71c1c' };
const ADMIN_PASSWORD = '19940926'; // 管理密码

const KEY = 'elev_maint_v1';
let state = { items: [], logs: [] };
let currentTab = 'normal';
let editingId = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state = { items: Array.isArray(d.items) ? d.items : [], logs: Array.isArray(d.logs) ? d.logs : [] };
    }
  } catch (e) { console.warn('读取失败', e); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { alert('保存失败：本地存储空间不足'); }
}

function statusOf(it) {
  const c = it.cycle || 15;
  const elapsed = diffDays(it.lastDate, today());
  const remain = c - elapsed;
  const nextDate = addDays(it.lastDate, c);
  let level;
  if (elapsed > c) level = 'overdue';
  else if (elapsed > c*2/3) level = 'red';
  else if (elapsed > c/3) level = 'orange';
  else level = 'green';
  return { elapsed, remain, nextDate, cycle: c, level };
}

function emptyBox(icon, title, sub) {
  return `<div class="empty"><div class="empty-ico">${icon}</div><div class="empty-t">${title}</div><div class="empty-s">${sub}</div></div>`;
}

function progressHTML(s) {
  const c = s.cycle;
  const pct = Math.min(100, Math.round(s.elapsed / c * 100));
  const color = COLOR[s.level] || COLOR.overdue;
  return `<div class="track"><div class="fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="scale"><span>0</span><span>${Math.round(c/3)}天</span><span>${Math.round(c*2/3)}天</span><span>${c}天</span></div>`;
}

function viewNormal(items) {
  if (!items.length) return emptyBox('🛠️', '暂无电梯', '点击右上角「＋ 添加」录入电梯和本次保养日期');
  return items.map(it => {
    const s = it._s;
    const color = COLOR[s.level];
    const warn = s.remain <= 5 ? '<span class="warn">⚠</span>' : '';
    let tip = '';
    if (s.remain <= 0) tip = '今天到期，请立即安排保养！';
    else if (s.remain <= 3) tip = `仅剩 ${s.remain} 天，赶紧保养！`;
    else if (s.remain <= 5) tip = `还剩 ${s.remain} 天，请尽快安排保养`;
    return `
    <div class="card lv-${s.level}" data-id="${it.id}">
      <div class="card-head">
        <div class="title">${warn}<span class="name">${esc(it.name)}</span></div>
        <div class="head-right">
          <button class="icon-btn" data-act="edit">✎</button>
          <button class="icon-btn" data-act="del">🗑</button>
        </div>
      </div>
      <div class="date-line">
        <span>本次 <b>${it.lastDate}</b></span><span class="arrow">→</span><span>下次 <b>${s.nextDate}</b></span>
      </div>
      ${progressHTML(s)}
      <div class="foot">
        <div class="stat">
          <span class="days" style="color:${color}">已过 ${s.elapsed} 天</span>
          <span class="muted">剩余 ${s.remain} 天 / 周期 ${s.cycle} 天</span>
        </div>
        <button class="btn-done" data-act="done">提交完成</button>
      </div>
      ${tip ? `<div class="tip" style="color:${color}">⚠ ${tip}</div>` : ''}
    </div>`;
  }).join('');
}

function viewOverdue(items) {
  if (!items.length) return emptyBox('🎉', '太好了，没有超期电梯', '所有电梯都在保养周期内');
  return items.map(it => {
    const s = it._s;
    const over = -s.remain;
    return `
    <div class="card lv-overdue" data-id="${it.id}">
      <div class="card-head">
        <div class="title"><span class="warn">⚠</span><span class="name">${esc(it.name)}</span></div>
        <div class="head-right">
          <button class="icon-btn" data-act="del" data-protected="1">🗑</button>
        </div>
      </div>
      <div class="date-line"><span>上次 <b>${it.lastDate}</b></span><span class="arrow">→</span><span>应保养 <b>${s.nextDate}</b></span></div>
      <div class="track"><div class="fill" style="width:100%;background:#b71c1c"></div></div>
      <div class="foot">
        <div class="stat">
          <span class="days" style="color:#b71c1c">已超期 ${over} 天</span>
          <span class="muted">已过 ${s.elapsed} 天 / 周期 ${s.cycle} 天</span>
        </div>
        <button class="btn-done" data-act="done" style="background:#b71c1c">提交完成</button>
      </div>
      <div class="tip" style="color:#b71c1c">⚠ 已超过保养周期，请立即保养！</div>
    </div>`;
  }).join('');
}

function viewDone(logs) {
  if (!logs.length) return emptyBox('📋', '暂无完成记录', '点击电梯卡片上的「提交完成」后会记录在这里');

  const groups = {};
  logs.forEach(l => {
    const ym = l.doneDate.slice(0, 7);
    if (!groups[ym]) groups[ym] = [];
    groups[ym].push(l);
  });

  const months = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  return months.map(ym => {
    const [y, m] = ym.split('-');
    const monthTitle = `${y}年${parseInt(m, 10)}月`;
    const list = groups[ym].sort((a, b) =>
      b.doneDate.localeCompare(a.doneDate) || (b.createdAt || 0) - (a.createdAt || 0)
    );

    const itemsHTML = list.map(l => `
      <div class="card lv-done" data-logid="${l.id}">
        <div class="card-head">
          <div class="title"><span class="check">✓</span><span class="name">${esc(l.name)}</span></div>
          <div class="head-right"><button class="icon-btn" data-act="delLog">🗑</button></div>
        </div>
        <div class="date-line"><span>完成 <b>${l.doneDate}</b></span><span class="arrow">→</span><span>下次 <b>${addDays(l.doneDate, l.cycle || 15)}</b></span></div>
        <div class="muted">上次保养日期：${l.fromDate}</div>
      </div>`).join('');

    return `
      <div class="month-group">
        <div class="month-header">
          <span class="month-title">${monthTitle}</span>
          <span class="month-count">${list.length} 条</span>
        </div>
        <div class="month-body">${itemsHTML}</div>
      </div>`;
  }).join('');
}

function setBadge(id, n, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = n > 0 ? n : '';
  el.className = 'badge' + (cls ? ' ' + cls : '');
  el.style.display = n > 0 ? '' : 'none';
}

function render() {
  const kw = ($('#searchInput')?.value || '').trim().toLowerCase();

  const normal = [], overdue = [];
  state.items.forEach(it => {
    it._s = statusOf(it);
    (it._s.level === 'overdue' ? overdue : normal).push(it);
  });
  normal.sort((a, b) => b._s.elapsed - a._s.elapsed);
  overdue.sort((a, b) => b._s.elapsed - a._s.elapsed);

  // 搜索过滤
  let displayNormal = normal;
  let displayOverdue = overdue;
  let displayLogs = state.logs;

  if (kw) {
    displayNormal = normal.filter(it => it.name.toLowerCase().includes(kw));
    displayOverdue = overdue.filter(it => it.name.toLowerCase().includes(kw));
    displayLogs = state.logs.filter(l => l.name.toLowerCase().includes(kw));
  }

  const redCount = normal.filter(i => i._s.level === 'red').length;
  $('#summary').innerHTML = `
    <div class="chip"><i class="dot g"></i>共 <b>${state.items.length}</b> 台</div>
    <div class="chip"><i class="dot o"></i>临近 <b>${redCount}</b></div>
    <div class="chip"><i class="dot r"></i>超期 <b>${overdue.length}</b></div>`;

  setBadge('b-normal', normal.length, '');
  setBadge('b-overdue', overdue.length, 'red');
  setBadge('b-done', state.logs.length, 'gray');

  const list = $('#list');
  if (currentTab === 'normal') {
    if (kw && displayNormal.length === 0) list.innerHTML = emptyBox('🔍', '没有找到匹配的电梯', '请更换关键词');
    else list.innerHTML = viewNormal(displayNormal);
  } else if (currentTab === 'overdue') {
    if (kw && displayOverdue.length === 0) list.innerHTML = emptyBox('🔍', '没有找到匹配的电梯', '请更换关键词');
    else list.innerHTML = viewOverdue(displayOverdue);
  } else {
    if (kw && displayLogs.length === 0) list.innerHTML = emptyBox('🔍', '没有找到匹配的记录', '请更换关键词');
    else list.innerHTML = viewDone(displayLogs);
  }
}

function doComplete(id) {
  const it = state.items.find(x => x.id === id);
  if (!it) return;
  const s = statusOf(it);
  const msg = s.level === 'overdue' ? `「${it.name}」已超期 ${-s.remain} 天，确认已完成保养？` : `确认「${it.name}」已完成保养？\n完成后将重新计算下次保养日期。`;
  if (!confirm(msg)) return;
  const t = today();
  state.logs.unshift({ id: uid(), itemId: it.id, name: it.name, fromDate: it.lastDate, doneDate: t, cycle: it.cycle || 15, createdAt: Date.now() });
  it.lastDate = t;
  save(); render();
  toast(`✅ 已完成，下次保养 ${addDays(t, it.cycle || 15)}`);
}

function doDelete(id) {
  const it = state.items.find(x => x.id === id);
  if (!it) return;
  const s = statusOf(it);
  if (s.level === 'overdue') {
    const pwd = prompt('该电梯已超期，删除需要管理密码：');
    if (pwd === null) return;
    if (pwd !== ADMIN_PASSWORD) { alert('密码错误，无法删除'); return; }
    if (!confirm(`密码正确。确定删除超期电梯「${it.name}」？`)) return;
  } else {
    if (!confirm(`确定删除「${it.name}」？\n（历史完成记录会保留）`)) return;
  }
  state.items = state.items.filter(x => x.id !== id);
  save(); render(); toast('已删除');
}

function doDeleteLog(id) {
  if (!confirm('确定删除这条完成记录？')) return;
  state.logs = state.logs.filter(x => x.id !== id);
  save(); render(); toast('已删除记录');
}

function doEdit(id) {
  const it = state.items.find(x => x.id === id);
  if (!it) return;
  editingId = id;
  $('#modalTitle').textContent = '编辑电梯';
  $('#inName').value = it.name;
  $('#inDate').value = it.lastDate;
  $('#inCycle').value = it.cycle || 15;
  showModal();
}

$('#list').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const card = btn.closest('.card');
  if (act === 'done') doComplete(card?.dataset.id);
  if (act === 'edit') {
    const it = state.items.find(x => x.id === card?.dataset.id);
    if (it && statusOf(it).level === 'overdue') {
      alert('超期电梯不能修改日期，请先提交完成');
      return;
    }
    doEdit(card?.dataset.id);
  }
  if (act === 'del') doDelete(card?.dataset.id);
  if (act === 'delLog') doDeleteLog(card?.dataset.logid);
});

function showModal() { $('#modal').classList.add('show'); setTimeout(() => $('#inName').focus(), 150); }
function closeModal() { $('#modal').classList.remove('show'); }

$('#addBtn').addEventListener('click', () => {
  editingId = null;
  $('#modalTitle').textContent = '添加电梯';
  $('#inName').value = '';
  $('#inDate').value = today();
  $('#inCycle').value = 15;
  showModal();
});

document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeModal));

$('#okBtn').addEventListener('click', () => {
  const name = $('#inName').value.trim();
  if (!name) { alert('请输入电梯名称'); return; }
  const date = $('#inDate').value || today();
  const cycle = Math.max(1, parseInt($('#inCycle').value, 10) || 15);
  if (editingId) {
    const it = state.items.find(x => x.id === editingId);
    if (it) { it.name = name; it.lastDate = date; it.cycle = cycle; }
  } else {
    state.items.push({ id: uid(), name, lastDate: date, cycle });
  }
  save(); closeModal(); render(); toast(editingId ? '已保存' : '✅ 已添加');
});

document.querySelectorAll('.tabbar button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.tabbar button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentTab = b.dataset.tab;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

// 搜索框输入实时过滤
$('#searchInput').addEventListener('input', render);

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

load();
$('#todayLabel').textContent = `今天 ${today()} 星期${WEEK[new Date().getDay()]}`;
render();

let lastDay = today();
setInterval(() => {
  if (today() !== lastDay) {
    lastDay = today();
    $('#todayLabel').textContent = `今天 ${today()} 星期${WEEK[new Date().getDay()]}`;
    render();
  }
}, 60000);
</script>
</body>
</html>
